# Windows installer build (PLAN item 11, docs/RELEASE.md).
#
# Exists because the team has no Windows dev machine: better-sqlite3-multiple-
# ciphers ships no prebuilds, so the Electron-ABI .node must be compiled ON
# Windows — windows-latest runners carry VS Build Tools out of the box.
# Trigger manually (Actions → windows-build → Run workflow) or push a v* tag;
# download ChatGoose-Setup-<version>.exe from the run's artifacts.
#
# The pilot remains unsigned until owner-provisioned credentials exist. The
# workflow validates and verifies Authenticode automatically once they do; see
# docs/RELEASE.md for the external setup that is still required.

name: windows-build

permissions:
  actions: read
  contents: read

# Only one run may mutate the shared update feed at a time. The remote publisher
# additionally takes a server-side lock and rejects non-increasing versions.
concurrency:
  # Only publishing runs hold the feed lock; a validation dispatch
  # (publishFeed=false) must never queue a release behind it or cancel it.
  group: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publishFeed) && 'chatgoose-windows-update-feed' || format('windows-build-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      publishFeed:
        description: "Upload this build to the Windows auto-update feed"
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 130
    env:
      # The feed URL this build polls: electron-builder.yml `publish.url`
      # without the trailing slash.
      FEED_URL: https://ext.gosling-agency.ru/u/bffe2540bd2b7e87bd9b88e3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      - name: Assert release SDK vendor provenance is clean
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishFeed == true
        run: node apps/desktop/scripts/assert-release-sdk-vendor.mjs

      - name: Check (typecheck + lint + test + build)
        timeout-minutes: 25
        run: pnpm check

      # Release hygiene (0.1.31 audit): refuse a mistagged build BEFORE anything
      # is built or uploaded — the post-upload assert then only guards the feed.
      - name: Assert tag == package.json before building
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg_version=$(node -p "require('./apps/desktop/package.json').version")
          tag_version="${GITHUB_REF#refs/tags/v}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version != package.json ($pkg_version) — bump before tagging"; exit 1
          fi

      - name: Assert publish tag is on origin/main
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishFeed == true
        timeout-minutes: 3
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Feed publication requires selecting/pushing a v* tag, not $GITHUB_REF"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          release_sha=$(git rev-list -n 1 "$GITHUB_REF")
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "::error::Release commit $release_sha is not an ancestor of origin/main"
            exit 1
          fi

      # Only a main *push* run proves cross-platform CI: PR runs skip the
      # Windows job (ci.yml), so a PR run for the same SHA must not satisfy it.
      - name: Assert exact commit passed cross-platform CI
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishFeed == true
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha=$(git rev-list -n 1 "$GITHUB_REF")
          ci_verified=false
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$release_sha&status=success&per_page=10&event=push&branch=main" \
              | node apps/desktop/scripts/assert-ci-success.mjs "$release_sha"; then
              ci_verified=true
              break
            fi
            echo "exact-SHA cross-platform CI verification attempt $attempt failed; retrying"
            sleep 10
          done
          if [ "$ci_verified" != true ]; then
            echo "::error::Release commit $release_sha has no successful exact-SHA CI run"
            exit 1
          fi

      - name: Assert production Core supports this Desktop lifecycle
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishFeed == true
        timeout-minutes: 5
        shell: bash
        run: |
          core_health="$RUNNER_TEMP/core-health-before-build.json"
          core_verified=false
          for attempt in 1 2 3 4 5 6; do
            if core_http_status=$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              "https://gosling-agency.ru/api/v1/health" \
              --output "$core_health" --write-out '%{http_code}') \
              && [ "$core_http_status" = 200 ] \
              && node apps/desktop/scripts/assert-kernel-capabilities.mjs desktop-lifecycle-v2 < "$core_health" \
              && node apps/desktop/scripts/assert-release-sdk-vendor.mjs \
                packages/kernel-sdk/kernel-sdk.vendor.json --health "$core_health"; then
              core_verified=true
              break
            fi
            echo "production Core lifecycle/contract verification attempt $attempt failed; retrying"
            sleep 10
          done
          if [ "$core_verified" != true ]; then
            echo "::error::Production Core must deploy desktop-lifecycle-v2 with this Desktop's exact SDK contractHash before publication"
            exit 1
          fi

      # An installed build can only ask the URL it was packaged with. Refuse a
      # release while that URL does not answer with the feed: this build could
      # never update again.
      - name: Assert the feed URL serves the feed
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishFeed == true
        timeout-minutes: 5
        shell: bash
        run: |
          polled_manifest="$RUNNER_TEMP/polled-latest.yml"
          polled_version=""
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$FEED_URL/latest.yml" --output "$polled_manifest" \
              && polled_version=$(node apps/desktop/scripts/release-feed.mjs served-version "$polled_manifest"); then
              break
            fi
            polled_version=""
            echo "feed URL check attempt $attempt failed; retrying"
            sleep 10
          done
          if [ -z "$polled_version" ]; then
            echo "::error::$FEED_URL does not serve the update feed; builds polling it would stop updating"
            exit 1
          fi
          echo "$FEED_URL serves $polled_version"

      - name: Validate optional Windows signing configuration
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          required="${WINDOWS_SIGNING_REQUIRED:-false}"
          case "$required" in
            true|false) ;;
            *) echo "::error::WINDOWS_SIGNING_REQUIRED must be true or false"; exit 1 ;;
          esac

          expected=false
          if [ -n "$CSC_LINK" ] || [ -n "$CSC_KEY_PASSWORD" ]; then
            if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
              echo "::error::WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD must be configured together"
              exit 1
            fi
            expected=true
          fi
          if [ "$required" = true ] && [ "$expected" != true ]; then
            echo "::error::Windows signing is required but signing credentials are unavailable"
            exit 1
          fi
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          if [ "$expected" != true ]; then
            echo "Unsigned pilot mode: Authenticode credentials are not configured"
          fi

      - name: Build Windows installer
        timeout-minutes: 25
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: pnpm dist:win

      # electron-updater reads the feed URL from the packaged app-update.yml
      # and nowhere else, so a wrong value strands every machine that installs
      # this build. It must be the URL the publication steps verify.
      - name: Assert the packaged feed URL
        shell: bash
        run: node apps/desktop/scripts/release-feed.mjs verify-app-update apps/desktop/release/win-unpacked/resources/app-update.yml "$FEED_URL"

      - name: Verify Authenticode when signing is configured or required
        shell: pwsh
        env:
          SIGNING_EXPECTED: ${{ steps.signing.outputs.expected }}
        run: |
          if ($env:SIGNING_EXPECTED -ne "true") {
            Write-Host "Unsigned pilot mode: skipping Authenticode verification"
            exit 0
          }
          $targets = @("apps/desktop/release/win-unpacked/ChatGoose.exe")
          $targets += @(Get-ChildItem "apps/desktop/release/ChatGoose-Setup-*.exe" | ForEach-Object FullName)
          if ($targets.Count -lt 2) {
            Write-Error "Expected both packaged application and installer for signature verification"
            exit 1
          }
          $updateConfig = "apps/desktop/release/win-unpacked/resources/app-update.yml"
          if (-not (Test-Path $updateConfig) -or
              -not (Select-String -LiteralPath $updateConfig -Pattern '^publisherName:' -Quiet)) {
            Write-Error "Signed build is missing publisherName in app-update.yml"
            exit 1
          }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
                $null -eq $signature.SignerCertificate) {
              Write-Error "Invalid Authenticode signature on $target (status=$($signature.Status))"
              exit 1
            }
            Write-Host "Valid Authenticode signature on $target ($($signature.SignerCertificate.Subject))"
          }

      # Packaged-launch smoke gate (D8): 0.1.30/0.1.31 shipped installers whose
      # main process died at module load — windowless, no error, invisible to
      # `pnpm check` (vitest resolves @kernel/sdk through its own transform,
      # not the packaged bundle). Launch the ACTUAL packaged binary; --smoke
      # boots on a throwaway profile and exits 0 only after navigation plus a
      # committed renderer IPC round trip; navigation/preload/renderer-process
      # failures exit non-zero. The DOA
      # class never reaches the exit call, so timeout remains its failure signal.
      # Nothing reaches the update feed without this going green.
      - name: Smoke-launch the packaged app
        timeout-minutes: 3
        shell: pwsh
        run: |
          $exe = "apps/desktop/release/win-unpacked/ChatGoose.exe"
          if (-not (Test-Path $exe)) { Write-Error "win-unpacked binary not found at $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke' -Wait -PassThru
          # `exit $null` exits 0, so a launch without an exit code fails here.
          if ($null -eq $p -or -not $p.HasExited -or $null -eq $p.ExitCode) {
            Write-Error "smoke launch reported no exit code"
            exit 1
          }
          Write-Host "smoke exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Upload to the update feed
        id: publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishFeed == true
        # A successful release has spent ~10 min in scp; keep room for it.
        timeout-minutes: 20
        shell: bash
        env:
          SSH_KEY: ${{ secrets.UPDATES_SSH_KEY }}
          FEED_DIR: /srv/chatgoose-updates/u/bffe2540bd2b7e87bd9b88e3
          # Public download page (ext site /desktop/): publish-feed.sh repoints
          # its ChatGoose-Setup-latest.exe symlink + version-win.json here after
          # every successful publication. Owned by cgupdates.
          PUBLIC_DL_DIR: /var/www/ext/desktop
        run: |
          stage_dir="$FEED_DIR/.incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SSH_OPTIONS=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=10
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
          )
          cleanup_publish() {
            status=$?
            trap - EXIT
            # This is independent of publish-feed.sh: it also runs when the
            # remote bash stream never starts after mkdir/scp succeeded.
            if [ -f "$HOME/.ssh/id_ed25519" ]; then
              if ! ssh "${SSH_OPTIONS[@]}" cgupdates@152.53.191.242 \
                "case '$stage_dir' in '$FEED_DIR'/.incoming/*) rm -rf -- '$stage_dir' ;; *) exit 2 ;; esac"; then
                echo "::warning::Could not confirm cleanup of remote publication stage $stage_dir"
              fi
            fi
            # No private deploy key may survive into a later action or its
            # post-job hook.
            rm -f ~/.ssh/id_ed25519
            exit "$status"
          }
          trap cleanup_publish EXIT
          if [ -z "$SSH_KEY" ]; then
            echo "::error::UPDATES_SSH_KEY secret is required for feed publication"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key of the feed server (152.53.191.242, agency-de).
          echo "152.53.191.242 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFVfNGPiVJY8E/IHh8QokJNJw9yP5az/fwiQtmT24C9Q" > ~/.ssh/known_hosts
          metadata=$(node apps/desktop/scripts/release-feed.mjs metadata apps/desktop/release/latest.yml)
          printf '%s\n' "$metadata" >> "$GITHUB_OUTPUT"
          version=$(printf '%s\n' "$metadata" | awk -F= '$1 == "version" { print $2 }')
          artifact=$(printf '%s\n' "$metadata" | awk -F= '$1 == "artifact" { print $2 }')
          sha512=$(printf '%s\n' "$metadata" | awk -F= '$1 == "sha512" { print $2 }')
          ssh "${SSH_OPTIONS[@]}" cgupdates@152.53.191.242 "command -v flock >/dev/null && command -v openssl >/dev/null && command -v cmp >/dev/null && command -v df >/dev/null"
          # Reclaim hard-killed stages and old installers, then enforce the
          # free-space floor before scp. All three actions use the same
          # server-side lock as publication. Blockmaps remain available so
          # clients on retained or older versions can use deltas.
          ssh "${SSH_OPTIONS[@]}" cgupdates@152.53.191.242 \
            "bash -s -- --maintain '$FEED_DIR'" < apps/desktop/scripts/publish-feed.sh
          ssh "${SSH_OPTIONS[@]}" cgupdates@152.53.191.242 "mkdir -p '$stage_dir'"
          scp "${SSH_OPTIONS[@]}" apps/desktop/release/*.exe apps/desktop/release/*.blockmap apps/desktop/release/latest.yml "cgupdates@152.53.191.242:$stage_dir/"
          # The initial capability gate is intentionally repeated after the
          # potentially slow maintenance/scp work and immediately before the
          # only command that can atomically replace latest.yml. A Core rollback
          # during build, signing, smoke, or upload therefore cannot silently
          # publish this Desktop lifecycle.
          core_health="$RUNNER_TEMP/core-health-at-publication.json"
          core_verified=false
          for attempt in 1 2 3 4 5 6; do
            if core_http_status=$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              "https://gosling-agency.ru/api/v1/health" \
              --output "$core_health" --write-out '%{http_code}') \
              && [ "$core_http_status" = 200 ] \
              && node apps/desktop/scripts/assert-kernel-capabilities.mjs desktop-lifecycle-v2 < "$core_health" \
              && node apps/desktop/scripts/assert-release-sdk-vendor.mjs \
                packages/kernel-sdk/kernel-sdk.vendor.json --health "$core_health"; then
              core_verified=true
              break
            fi
            echo "publication-boundary Core lifecycle/contract verification attempt $attempt failed; retrying"
            sleep 10
          done
          if [ "$core_verified" != true ]; then
            echo "::error::Production Core lost desktop-lifecycle-v2 or this Desktop's exact SDK contractHash before publication"
            exit 1
          fi
          # Server-side lock + monotonic version check; assets are renamed into
          # place first and latest.yml is one final same-filesystem atomic rename.
          if ! ssh "${SSH_OPTIONS[@]}" cgupdates@152.53.191.242 "bash -s -- '$FEED_DIR' '$stage_dir' '$PUBLIC_DL_DIR'" < apps/desktop/scripts/publish-feed.sh; then
            # The server may have committed the atomic rename before the SSH
            # acknowledgement was lost. Prove THIS run's bytes are live before
            # deciding the publication failed; never rebuild/retry an equal tag.
            served_manifest="$RUNNER_TEMP/ambiguous-latest.yml"
            served_artifact="$RUNNER_TEMP/ambiguous-$artifact"
            ambiguous_verified=false
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$FEED_URL/latest.yml" --output "$served_manifest" \
                && node apps/desktop/scripts/release-feed.mjs verify-manifest "$served_manifest" "$version" "$artifact" "$sha512" \
                && curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 "$FEED_URL/$artifact" --output "$served_artifact" \
                && node apps/desktop/scripts/release-feed.mjs verify-artifact "$served_manifest" "$served_artifact"; then
                ambiguous_verified=true
                break
              fi
              echo "ambiguous publication verification attempt $attempt failed; retrying"
              sleep 10
            done
            if [ "$ambiguous_verified" != true ]; then
              echo "::error::Feed publication failed and this run's exact release could not be verified"
              exit 1
            fi
            echo "::warning::SSH acknowledgement was lost, but this run's exact release is live"
            # The remote publisher died before (or during) the public-page
            # refresh, so converge the download page explicitly — a stale page
            # must not survive a lost acknowledgement.
            public_refreshed=false
            for attempt in 1 2 3; do
              if ssh "${SSH_OPTIONS[@]}" cgupdates@152.53.191.242 \
                "bash -s -- --refresh-public '$FEED_DIR' '$PUBLIC_DL_DIR'" < apps/desktop/scripts/publish-feed.sh; then
                public_refreshed=true
                break
              fi
              echo "public download refresh attempt $attempt failed; retrying"
              sleep 10
            done
            if [ "$public_refreshed" != true ]; then
              echo "::error::Release is live but the public download page could not be refreshed — run publish-feed.sh --refresh-public on the feed host"
              exit 1
            fi
          fi

      - name: Remove update-feed deploy key
        if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.publishFeed == true)
        shell: bash
        run: rm -f ~/.ssh/id_ed25519

      # Release hygiene (Stage 35): what the feed SERVES must be this release —
      # served latest.yml version == apps/desktop/package.json == the v* tag.
      # Recovery if this fires: the stage-04 artifact-diff ritual (docs/RELEASE.md).
      - name: Assert served feed version == package.json == tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishFeed == true
        timeout-minutes: 18
        shell: bash
        env:
          EXPECTED_ARTIFACT: ${{ steps.publish.outputs.artifact }}
          EXPECTED_SHA512: ${{ steps.publish.outputs.sha512 }}
        run: |
          pkg_version=$(node -p "require('./apps/desktop/package.json').version")
          served_manifest="$RUNNER_TEMP/served-latest.yml"
          served_artifact="$RUNNER_TEMP/$EXPECTED_ARTIFACT"
          verified=false
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$FEED_URL/latest.yml" --output "$served_manifest" \
              && node apps/desktop/scripts/release-feed.mjs verify-manifest "$served_manifest" "$pkg_version" "$EXPECTED_ARTIFACT" "$EXPECTED_SHA512" \
              && curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 "$FEED_URL/$EXPECTED_ARTIFACT" --output "$served_artifact" \
              && node apps/desktop/scripts/release-feed.mjs verify-artifact "$served_manifest" "$served_artifact"; then
              verified=true
              break
            fi
            echo "served feed verification attempt $attempt failed; retrying"
            sleep 10
          done
          if [ "$verified" != true ]; then
            echo "::error::Served feed did not converge to this run after six attempts"
            exit 1
          fi
          echo "package.json=$pkg_version served artifact=$EXPECTED_ARTIFACT sha512=$EXPECTED_SHA512 ref=$GITHUB_REF"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "::error::Tag v$tag_version != package.json ($pkg_version)"; exit 1
            fi
          fi

      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: chatgoose-windows-installer
          retention-days: 3
          path: |
            apps/desktop/release/ChatGoose-Setup-*.exe
            apps/desktop/release/ChatGoose-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
