# Windows installer build (PLAN item 11, docs/RELEASE.md).
#
# Exists because the team has no Windows dev machine: better-sqlite3-multiple-
# ciphers ships no prebuilds, so the Electron-ABI .node must be compiled ON
# Windows — windows-latest runners carry VS Build Tools out of the box.
# Trigger manually (Actions → windows-build → Run workflow) or push a v* tag;
# download ChatGoose-Setup-<version>.exe from the run's artifacts.
#
# The artifact is UNSIGNED (code signing is an owner/admin task) — installing
# it walks through SmartScreen, see docs/WINDOWS-VERIFICATION.md.

name: windows-build

on:
  workflow_dispatch:
    inputs:
      publishFeed:
        description: "Upload this build to the Windows auto-update feed"
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm dist:win

      - name: Upload to the update feed
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishFeed == true
        shell: bash
        env:
          SSH_KEY: ${{ secrets.UPDATES_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::notice::UPDATES_SSH_KEY secret not set — feed upload skipped"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key of the feed server (45.8.230.111).
          echo "45.8.230.111 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKVfAxl4anwdXe3m+tK5yajpXDZD7iD1D1uc6A+y6o9Y" > ~/.ssh/known_hosts
          # latest.yml goes LAST: clients polling mid-upload must never see a
          # manifest that points at a not-yet-uploaded installer.
          scp apps/desktop/release/*.exe apps/desktop/release/*.blockmap cgupdates@45.8.230.111:/srv/chatgoose-updates/u/bffe2540bd2b7e87bd9b88e3/
          scp apps/desktop/release/latest.yml cgupdates@45.8.230.111:/srv/chatgoose-updates/u/bffe2540bd2b7e87bd9b88e3/
          echo "feed updated"

      # Release hygiene (Stage 35): what the feed SERVES must be this release —
      # served latest.yml version == apps/desktop/package.json == the v* tag.
      # Recovery if this fires: the stage-04 artifact-diff ritual (docs/RELEASE.md).
      - name: Assert served feed version == package.json == tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publishFeed == true
        shell: bash
        run: |
          pkg_version=$(node -p "require('./apps/desktop/package.json').version")
          served_version=$(curl -sSk https://45-8-230-111.sslip.io/u/bffe2540bd2b7e87bd9b88e3/latest.yml | awk '/^version:/ { print $2; exit }' | tr -d '\r')
          echo "package.json=$pkg_version served=$served_version ref=$GITHUB_REF"
          if [ "$served_version" != "$pkg_version" ]; then
            echo "::error::Served feed version ($served_version) != package.json ($pkg_version)"; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "::error::Tag v$tag_version != package.json ($pkg_version)"; exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: chatgoose-windows-installer
          retention-days: 3
          path: |
            apps/desktop/release/ChatGoose-Setup-*.exe
            apps/desktop/release/ChatGoose-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
