# Windows installer build (PLAN item 11, docs/RELEASE.md).
#
# Exists because the team has no Windows dev machine: better-sqlite3-multiple-
# ciphers ships no prebuilds, so the Electron-ABI .node must be compiled ON
# Windows — windows-latest runners carry VS Build Tools out of the box.
# Trigger manually (Actions → windows-build → Run workflow) or push a v* tag;
# download ChatGoose-Setup-<version>.exe from the run's artifacts.
#
# The artifact is UNSIGNED (code signing is an owner/admin task) — installing
# it walks through SmartScreen, see docs/WINDOWS-VERIFICATION.md.

name: windows-build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: chatgoose-windows-installer
          path: |
            apps/desktop/release/ChatGoose-Setup-*.exe
            apps/desktop/release/ChatGoose-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  # Pushes the build onto the auto-update feed (electron-builder.yml `publish`).
  # Runs only for v* tags and only when the UPDATES_SSH_KEY secret is set
  # (private key of the `cgupdates` user on the feed host — docs/RELEASE.md).
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chatgoose-windows-installer
          path: feed

      - name: Upload to the update feed
        env:
          SSH_KEY: ${{ secrets.UPDATES_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::notice::UPDATES_SSH_KEY secret not set — feed upload skipped (installer is still in the artifacts)"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key of the feed server (45.8.230.111).
          echo "45.8.230.111 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKVfAxl4anwdXe3m+tK5yajpXDZD7iD1D1uc6A+y6o9Y" > ~/.ssh/known_hosts
          # latest.yml goes LAST: clients polling mid-upload must never see a
          # manifest that points at a not-yet-uploaded installer.
          scp feed/*.exe feed/*.blockmap cgupdates@45.8.230.111:/srv/chatgoose-updates/u/bffe2540bd2b7e87bd9b88e3/
          scp feed/latest.yml cgupdates@45.8.230.111:/srv/chatgoose-updates/u/bffe2540bd2b7e87bd9b88e3/
          echo "feed updated"
