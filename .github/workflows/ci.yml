# PR/push quality gate (Stage 35 CI floor — the zero-PR-CI era ends here).
# Runs the same `pnpm check` a dev runs locally: typecheck + lint + vitest
# (node-env) + electron-vite build — all linux-safe, no display or Windows
# toolchain needed (installers are windows-build.yml's job).

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + lint + test + build)
        run: pnpm check
