# PR/push quality gate (Stage 35 CI floor — the zero-PR-CI era ends here).
# Runs the same `pnpm check` a dev runs locally: typecheck + lint + vitest
# (node-env) + electron-vite build — all linux-safe, no display or Windows
# toolchain needed (installers are windows-build.yml's job).
#
# Cost policy: PRs run the Linux gate only; pushes to main run Linux + Windows
# (windows-build.yml's release guard requires a successful main push run of
# this workflow for the exact tag SHA). The Linux job runs on the owner's PC
# pool when the repository variable CI_POOL is 'pc' (first attempt only —
# re-runs always go to GitHub-hosted in case the PC died mid-run).

name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Superseded PR runs are cancelled. Each push to main gets its own group
# (run_id): a shared group would let GitHub cancel a *pending* main run when a
# newer one queues, leaving that SHA without the CI run the release guard needs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: pnpm check
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && fromJSON('["self-hosted","ci-pc"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # The action wipes its install folder first; PC runners share one
          # $HOME, so each job installs pnpm under its own runner temp.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # The Actions cache only pays off on GitHub-hosted runners; the PC
          # uses its persistent pnpm store (see Install dependencies).
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - name: Install dependencies
        # pnpm keeps its store inside the (per-job) setup folder; on the PC
        # point it at a persistent store shared by all runners (safe for
        # concurrent installs, same filesystem as the work dirs).
        env:
          PNPM_PC_STORE: ${{ runner.environment == 'self-hosted' && '1' || '' }}
        run: |
          if [ -n "$PNPM_PC_STORE" ]; then export npm_config_store_dir="$HOME/.local/share/pnpm/store"; fi
          pnpm install --frozen-lockfile

      - name: Check (typecheck + lint + test + build)
        run: pnpm check

  windows-check:
    name: pnpm check (Windows)
    # Push-only (main). A job skipped by `if` reports Success to required
    # checks, so PR merges are not blocked. PRs touching native modules, paths,
    # the installer or the updater: dispatch windows-build (publishFeed=false)
    # before merging.
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + lint + test + build)
        timeout-minutes: 20
        run: pnpm check
