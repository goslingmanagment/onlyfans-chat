# PR/push quality gate (Stage 35 CI floor — the zero-PR-CI era ends here).
# Runs the same `pnpm check` a dev runs locally: typecheck + lint + vitest
# (node-env) + electron-vite build — all linux-safe, no display or Windows
# toolchain needed (installers are windows-build.yml's job).

name: CI

on:
  pull_request:
    # ready_for_review added so the required Windows check gets a run on the
    # SHA being merged once the PR leaves Draft.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

# A superseded PR head has nothing left to prove — cancel its run instead of
# letting it burn the minutes budget. Main runs always complete: that run is
# the only finished-check record its commit ever gets.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + lint + test + build)
        run: pnpm check

  windows-check:
    name: pnpm check (Windows)
    # Windows minutes bill at 2x — run once per PR when it goes ready (and on
    # main), not on every Draft sync; the Linux check covers the iteration loop.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + lint + test + build)
        timeout-minutes: 20
        run: pnpm check
