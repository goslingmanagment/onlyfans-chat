# PR/push quality gate (Stage 35 CI floor — the zero-PR-CI era ends here).
# Runs the same `pnpm check` a dev runs locally: typecheck + lint + vitest
# (node-env) + electron-vite build — all linux-safe, no display or Windows
# toolchain needed (installers are windows-build.yml's job).
#
# Ready PRs and pushes to main run this one Linux job; Drafts skip it.
# windows-build.yml's release guard requires a successful main push run of
# this workflow for the exact tag SHA, then reruns `pnpm check` on Windows
# itself before building. Runners: GitHub-hosted only (owner, 2026-10-21) —
# the repository is public, so they are free, and a public repository must
# never reach the owner's PC: no job names a self-hosted label, and none is
# registered to the repo.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main

# Superseded PR runs are cancelled. Each push to main gets its own group
# (run_id): a shared group would let GitHub cancel a *pending* main run when a
# newer one queues, leaving that SHA without the CI run the release guard needs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Ready starts the required check; converting back to Draft cancels the
    # old PR run through the same concurrency group without starting a runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      # Two commits deep: on a PR, GitHub's merge commit and its first parent,
      # the base branch's tip — the next step compares the two.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # A PR that changes only prose — Markdown in the root, docs/**/*.md,
      # .agentic/**, .claude/** — runs nothing: every step below is skipped
      # and the job ends green, so the required check still reports success.
      # (Why not paths-ignore: a workflow that does not start reports nothing,
      # and the PR would wait for its required check forever.) Markdown
      # anywhere else may be a build input or a test fixture and counts as
      # code. Pushes to main always run in full; any doubt is run=true, and
      # the steps test for "not false".
      - name: Does this change need the check?
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          run=true
          if git rev-parse -q --verify 'HEAD^2' > /dev/null && changed=$(git diff --name-only --no-renames 'HEAD^1' HEAD) && [ -n "$changed" ]; then
            run=false
            while IFS= read -r file; do
              case "$file" in
                docs/*.md | .agentic/* | .claude/*) ;;
                */*) run=true ;;
                *.md) ;;
                *) run=true ;;
              esac
              if [ "$run" = true ]; then echo "needs the check: $file"; break; fi
            done <<< "$changed"
          fi
          [ "$run" = true ] || echo 'prose only (root *.md, docs/**/*.md, .agentic, .claude): nothing to check'
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # pnpm version from package.json "packageManager". The action wipes its
      # install folder first, so it stays in runner temp.
      - name: Setup pnpm
        if: steps.scope.outputs.run != 'false'
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        if: steps.scope.outputs.run != 'false'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.run != 'false'
        env:
          # pnpm check runs Node tests and electron-vite build; the Electron
          # binary (~130 s on a cold install) is only needed by windows-build.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          pnpm install --frozen-lockfile

      # The parts of `pnpm check`, read from package.json at run time, with the
      # read-only ones side by side and the rest alone in chain order
      # (scripts/ci-parallel-check.mjs), using the runner's four vCPUs. exec:
      # on cancel or timeout the runner signals only the step's own process, so
      # node must be that process to stop the parts and print the logs they
      # wrote.
      - name: Check (typecheck + lint + test + build, parts in parallel)
        if: steps.scope.outputs.run != 'false'
        run: exec node scripts/ci-parallel-check.mjs
